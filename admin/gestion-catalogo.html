<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>NXR TECH -Crud</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/crud.css">
   <link rel="stylesheet" href="../css/panel.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>
    <header class="panel-topbar">
        <a href="../inicio.html" class="panel-topbar-marca" style="text-decoration: none;">
            <img src="../img/nxrtech_logo.png" alt="NXR TECH">
            <span>Panel Administrativo</span>
        </a>

        <div class="panel-topbar-usuario">
            <div class="panel-avatar" id="panel-avatar-iniciales">--</div>
            <div class="panel-topbar-datos">
                <strong id="panel-nombre-admin">Cargando...</strong>
                <small id="panel-rol-admin">Administrador</small>
            </div>
            <button class="btn btn-primary btn-lg px-4" onclick="abrirModalRegistrar()">

                <i class="fa-solid fa-plus me-2"></i>
                Nuevo Producto / Servicio

            </button>

            <button class="panel-btn-salir" onclick="cerrarSesion()">
                <i class="fa-solid fa-right-from-bracket"></i> <span class="panel-btn-salir-texto">Salir</span>
            </button>
        </div>

    </header>


    <div class="container py-4 crud-container">

        <div class="crud-titulo mb-4">

            <h2>
                Gestión del Catálogo
            </h2>

            <p>
                Administra productos y servicios de NXR TECH.
            </p>

        </div>



        <!-- BUSCADOR -->

        <div class="card crud-card crud-search-card mb-4">

            <div class="card-body crud-toolbar">

                <div class="row g-3">

                    <div class="col-lg-8">

                        <label class="form-label crud-label">
                            Buscar por nombre,marca o descripcion
                        </label>

                        <input id="txtBuscar" class="crud-input"
                            placeholder="Ingrese el nombre del producto ,servicio,marca o descripcion....">
                    </div>

                </div>

            </div>

        </div>




        <!-- TABLA -->

        <div class="card crud-card">

            <div class="card-header crud-header">

                <div class="d-flex justify-content-between align-items-center">

                    <span>

                        Catálogo

                    </span>

                    <span class="crud-badge" id="lblCantidad">

                        0 registros

                    </span>

                </div>

            </div>



            <div class="table-responsive">

                <table class="table table-hover align-middle mb-0 crud-table">

                    <thead>

                        <tr>

                            <th style="width:90px;">
                                Imagen
                            </th>

                            <th style="width:120px;">
                                Código
                            </th>

                            <th>
                                Nombre
                            </th>

                            <th style="width:130px;">
                                Tipo
                            </th>

                            <th style="width:170px;">
                                Categoría
                            </th>

                            <th style="width:120px;">
                                Precio
                            </th>

                            <th style="width:120px;">
                                Estado
                            </th>

                            <th style="width:170px;">
                                Acciones
                            </th>

                        </tr>

                    </thead>

                    <tbody id="listaCatalogo">

                    </tbody>

                </table>

            </div>

        </div>

    </div>
    <div class="modal fade" id="modalCatalogo" tabindex="-1" aria-hidden="true">

        <div class="modal-dialog modal-xl modal-dialog-scrollable crud-modal-dialog">

            <div class="modal-content crud-modal">

                <div class="modal-header crud-modal-header">

                    <h5 class="modal-title crud-modal-title" id="tituloModal">
                        Nuevo Registro
                    </h5>

                    <button type="button" class="btn-close" data-bs-dismiss="modal">
                    </button>

                </div>

                <div class="modal-body crud-modal-body">

                    <input type="hidden" id="itemID">

                    <div class="row g-3">

                        <div class="col-md-4">

                            <label class="form-label crud-label">
                                Tipo
                            </label>

                            <select id="tipo" class="form-select crud-select">

                                <option value="Producto">
                                    Producto
                                </option>

                                <option value="Servicio">
                                    Servicio
                                </option>

                            </select>

                        </div>

                        <div class="col-md-8">

                            <label class="form-label crud-label">
                                Nombre
                            </label>

                            <input id="nombre" type="text" class="crud-input">

                        </div>
                        <div class="col-md-6">

                            <label class="form-label crud-label">
                                Categoría
                            </label>

                            <input id="subcategoria" type="text" class="crud-input" placeholder="Ingrese la categoría">

                        </div>

                        <div class="col-md-6">

                            <label class="form-label crud-label">
                                Precio
                            </label>

                            <input id="precio" type="number" min="0" class="crud-input">

                        </div>

                    </div>

                    <hr class="crud-divider">

                    <!-- PRODUCTO -->

                    <div id="panelProducto" class="crud-panel">

                        <div class="row g-3">

                            <div class="col-md-6">

                                <label class="form-label crud-label">
                                    Marca
                                </label>

                                <input id="marca" class="crud-input">

                            </div>

                            <div class="col-md-6">

                                <label class="form-label crud-label">
                                    Stock
                                </label>

                                <input id="stock" type="number" min="0" class="crud-input">

                            </div>

                        </div>

                    </div>

                    <!-- SERVICIO -->

                    <div id="panelServicio" class="crud-panel" style="display:none;">

                        <div class="row g-3">

                            <div class="col-md-6">

                                <label class="form-label crud-label">
                                    Garantía
                                </label>

                                <input id="garantia" class="crud-input">

                            </div>

                            <div class="col-md-6">

                                <label class="form-label crud-label">
                                    Modalidad
                                </label>

                                <select id="modalidad" class="crud-select">

                                    <option>Presencial</option>
                                    <option>Virtual</option>
                                    <option>Remoto</option>
                                    <option>Híbrido</option>

                                </select>

                            </div>

                        </div>

                    </div>

                    <hr class="crud-divider">

                    <div class="row">

                        <div class="col-lg-8">

                            <label class="form-label crud-label">
                                Descripción
                            </label>

                            <textarea id="descripcion" rows="7" class="form-control crud-textarea"></textarea>

                        </div>

                        <div class="col-lg-4">

                            <label class="form-label crud-label">
                                Imagen
                            </label>

                            <input id="imagen" type="file" accept="image/*" class="crud-input">

                            <div class="text-center mt-3 crud-preview-container">

                                <img id="preview" src="../img/sin-imagen.png" class="img-fluid crud-preview">

                            </div>

                        </div>

                    </div>

                </div>

                <div class="modal-footer crud-modal-footer">

                    <button class="btn-secundario crud-btn-cancelar" data-bs-dismiss="modal">

                        Cancelar

                    </button>

                    <button class="btn-primario" onclick="guardarItem()">

                        Guardar

                    </button>

                </div>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/catalogo/catalogo.js"></script>
    <script src="../js/catalogo/datos.js"></script>
    <script src="../js/admin/usuarios.js"></script>
    <script src="../js/admin/auth.js"></script>
    <script src="../js/admin/panel.js"></script>
    <script src="../js/admin/crud.js"></script>

</body>

</html>
