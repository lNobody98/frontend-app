<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NXR TECH - Acceso Administrador</title>
    <link rel="icon" type="image/x-icon" href="../img/nxrtech.ico">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@700;800&display=swap"
        rel="stylesheet">

    <!-- Font Awesome 6.5 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Estilos del proyecto -->
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/login.css">
</head>

<body>

    <!-- Christian Díaz — Barra superior con acceso a Login -->
    <header class="login-topbar">
        <img src="../img/nxrtech_logo.png" alt="NXR TECH">
        <span>Panel Administrativo</span>
    </header>

    <main class="login-wrapper">
        <div class="login-card">

            <div class="login-card-icono">
                <i class="fa-solid fa-user-shield"></i>
            </div>

            <h1>Acceso Administrador</h1>

            <form id="form-login" novalidate>

                <div class="login-campo">
                    <label for="input-usuario">Usuario</label>
                    <div class="login-campo-input">
                        <input type="text" id="input-usuario" name="usuario" autocomplete="username" placeholder="Ej. cdiaz">
                    </div>
                </div>

                <div class="login-campo">
                    <label for="input-contrasena">Contraseña</label>
                    <div class="login-campo-input">
                        <input type="password" id="input-contrasena" name="contrasena" autocomplete="current-password" placeholder="••••••••">
                        <i class="fa-solid fa-eye" id="btn-mostrar-clave"></i>
                    </div>
                </div>

                <button type="submit" class="login-boton">Iniciar sesión</button>

                <p class="login-mensaje-error" id="mensaje-error"></p>

            </form>

            <a href="../inicio.html" class="login-volver">
                <i class="fa-solid fa-arrow-left"></i> Volver al sitio
            </a>

        </div>
    </main>

    <!-- Scripts -->
    <script src="../js/admin/usuarios.js"></script>
    <script src="../js/admin/auth.js"></script>
    <script src="../js/admin/login.js"></script>
</body>

</html>
