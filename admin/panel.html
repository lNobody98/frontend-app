<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NXR TECH - Panel Administrador</title>
    <link rel="icon" type="image/x-icon" href="../img/nxrtech.ico">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@700;800&display=swap"
        rel="stylesheet">

    <!-- Font Awesome 6.5 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Estilos del proyecto -->
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/panel.css">
</head>

<body>

    <!-- Christian Díaz — Barra superior del panel -->
    <header class="panel-topbar">
        <div class="panel-topbar-marca">
            <img src="../img/nxrtech_logo.png" alt="NXR TECH">
            <span>Panel Administrativo</span>
        </div>

        <div class="panel-topbar-usuario">
            <div class="panel-avatar" id="panel-avatar-iniciales">--</div>
            <div class="panel-topbar-datos">
                <strong id="panel-nombre-admin">Cargando...</strong>
                <small id="panel-rol-admin">Administrador</small>
            </div>
            <button class="panel-btn-salir" id="btn-cerrar-sesion-top">
                <i class="fa-solid fa-right-from-bracket"></i> Salir
            </button>
        </div>
    </header>

    <div class="panel-layout">

        <!-- Christian Díaz — Menú lateral del panel -->
        <aside class="panel-sidebar">
            <a href="panel.html" class="panel-sidebar-link activo">
                <i class="fa-solid fa-gauge"></i> Dashboard
            </a>
            <a href="gestion-catalogo.html" class="panel-sidebar-link">
                <i class="fa-solid fa-boxes-stacked"></i> Productos y servicios
            </a>
            <a href="reportes.html" class="panel-sidebar-link">
                <i class="fa-solid fa-chart-column"></i> Reportes
            </a>

            <div class="panel-sidebar-separador"></div>

            <a href="#" class="panel-sidebar-link" id="btn-cerrar-sesion-menu">
                <i class="fa-solid fa-right-from-bracket"></i> Cerrar sesión
            </a>
        </aside>

        <!-- Zona de contenido: aquí se monta el CRUD (Juan) y los
             reportes (Maykol) cuando entren desde el menú lateral -->
        <main class="panel-contenido">
            <h1 class="panel-bienvenida" id="panel-bienvenida">Bienvenido</h1>

            <div class="panel-stats">
                <div class="panel-stat-card">
                    <i class="fa-solid fa-boxes-stacked"></i>
                    <span>Total Productos</span>
                    <strong id="stat-total-productos">—</strong>
                </div>
                <div class="panel-stat-card">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span>Pedidos del día</span>
                    <strong id="stat-pedidos-dia">—</strong>
                </div>
                <div class="panel-stat-card">
                    <i class="fa-solid fa-eye"></i>
                    <span>Visitas</span>
                    <strong id="stat-visitas">—</strong>
                </div>
            </div>
        </main>

    </div>

    <!-- Scripts -->
    <!-- catalogo.js + datos.js: solo para leer el total real de productos -->
    <script src="../js/catalogo/catalogo.js"></script>
    <script src="../js/catalogo/datos.js"></script>

    <script src="../js/admin/usuarios.js"></script>
    <script src="../js/admin/auth.js"></script>
    <script src="../js/admin/panel.js"></script>
</body>

</html>
